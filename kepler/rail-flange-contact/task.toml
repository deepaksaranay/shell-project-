schema_version = "1.4"

artifacts = ["/app/output/flange_contact.json"]

[task]
name = "afterquery/rail-flange-contact"
description = "Find the equilibrium position and the two contact patches (tread and flange) of a flanging railway wheel under given vertical and lateral loads, yaw and wheel speed, with Kalker's exact rolling-contact theory on each patch, and report each patch's contact angle, normal force and creep forces."
authors = [{ name = "Deepak Kumar", email = "deepakkumar.dar@gmail.com" }]
keywords = ["wheel-rail contact", "two-point contact", "flange contact", "Kalker exact theory", "creep forces", "derailment"]

[metadata]
author_name = "Deepak Kumar"
author_email = "deepakkumar.dar@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://github.com/deepaksaranay"
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "railway vehicle dynamics: two-point wheel-rail flange contact"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = ["rolling-contact", "wheel-rail", "flange-contact", "two-point-contact", "boundary-element-method", "derailment-safety"]
expert_time_estimate_hours = 16
relevant_experience = "Mechanical engineer with a fluid-mechanics and solid-mechanics computation background; author of previously accepted engineering-computation benchmark tasks. For this task I implemented three multi-point wheel-rail contact solvers with different discretisations, normal and tangential algorithms and equilibrium strategies, and validated the patch solver against Kalker's tabulated creep coefficients."
difficulty_explanation = "In practice this analysis is done by railway vehicle-dynamics engineers and wheel-rail interface specialists at rolling-stock manufacturers, infrastructure managers and research institutes, when they assess flange contact in tight curves for derailment safety (flange-climb ratios), flange wear and gauge-corner damage. The core problem is a coupled multi-point contact problem, not a single patch with given creepages. The solver has to: find the tread and flange contact points from the measured profiles; set up each patch in its own tangent plane, rotating both profiles by a 68-degree contact angle at the flange; solve displacement-controlled exact normal problems; derive each patch's creepages from the wheelset kinematics (the flange rolls on a 9 mm larger radius, so it slips at -2% with a spin near 2 per metre while the tread is in partial slip); solve Kalker's steady-rolling problem on both patches; and find the unknown lateral and vertical wheel position from force equilibrium in which the creep forces feed back into the load split. Rigid two-point contact is knife-edge sensitive (the flange gap closes about 2.5 mm per mm of lateral shift), so only the elastic equilibrium gives a well-defined answer. The shortcuts all fail: leaving the creep forces out of the equilibrium gets the flange load wrong by up to 19 kN (24% of Q); using one rolling radius for both patches flips the sign of the flange's longitudinal force; treating the patches as horizontal misplaces the wheel by 0.03 mm and gets creep forces wrong by up to 1.8 kN; a 1 mm grid misses the flange creep force. The profiles and loads are synthetic but realistic (worn tread, R13 gauge corner, 68-degree flank, Q = 60-80 kN, Y/Q = 0.25-0.6), so no published result applies."
solution_explanation = "solution/solve.py: in each wheel region (tread y_w < 12 mm, flange y_w >= 12 mm) it finds the minimum of the vertical separation on a 0.01 mm resampling and takes the contact angle from the rail slope there. It rotates both profiles into each patch's tangent plane and adds the longitudinal curvature cos(gamma)/r_i. It builds 0.4 mm half-space boundary elements with closed-form Boussinesq/Cerruti rectangle integrals, looked up from offset tables, and solves the normal problem by a displacement-controlled active set. Creepages come from the kinematic formulas, and steady rolling is the fixed point of Kalker's transient scheme with FISTA steps, warm-started between evaluations. A Newton stage on a normal-force-only model gets close, then Broyden's method on the full model (creep forces included) solves sum F_z = Q and sum F_y = Y. All six cases take about 70 s."
verification_explanation = "The tests read /app/output/flange_contact.json. It must be a regular file (symlinks are rejected) with exactly the documented keys, every case once, and finite numbers or null for a patch not in contact. For each load case they check the lateral shift within 0.01 mm and, for both patches, the contact angle within 0.3 deg, the normal force within 1% of Q, and the tangential force vector (Fx, Fs) within 1% of Q. The answer key (tests/answer_key.json) comes from a separate generator (authoring/provenance/twopoint.py: parabolic-refined contact points, dense influence matrices, active-set normal solve, FISTA transient-scheme tangential solve, and an equilibrium iteration with frozen creep-to-normal force ratios) on 0.3 mm elements. Its 0.4 mm run, exported to the output schema by authoring/provenance/export_for_verifier.py (verifier_inputs/generator_el0.4.json), passes 6/6 with at most 23% of any limit used. The shipped solution does not produce the key. The limits are set from how closely structurally different correct implementations agree with the key, each scored by running the unchanged tests/test_outputs.py on a schema-exact output file (authoring/run_verifier_checks.sh runs every file in authoring/evidence/verifier_inputs/ and records the pytest output in authoring/evidence/verifier_runs.log). (1) authoring/provenance/independent_submission.py, written separately, uses bounded scalar minimisation for the contact points, non-square 0.25 x 0.35 mm elements on an offset grid, FFT convolution, a Polonsky-Keer conjugate-gradient normal solver, ADMM transient-scheme steps, and an alternating normal-equilibrium / creep-force iteration. It writes the output schema itself (authoring/evidence/independent_submission_output.json, copied to verifier_inputs/independent_submission.json) and passes 6/6, using at most 15% of any limit (worst: normal force 85 N, creep force 105 N, contact angle 0.045 deg, shift 0.0002 mm). (2) The shipped solution/solve.py output (verifier_inputs/oracle.json) passes 6/6, using at most 29% of any limit (normal force 165 N, creep force 139 N, contact angle 0.088 deg). Flawed models, exported the same way (verifier_inputs/baseline_*.json), fail: ignoring the creep forces in the equilibrium (normal force off by 23x the limit), one rolling radius for both patches (creep force 32x the limit), horizontal patches (5 of 6 cases fail), and a 1 mm grid (2 of 6 cases fail). A missing file, a symlink, a copy of the answer key, or extra or renamed keys all score 0."

[verifier]
