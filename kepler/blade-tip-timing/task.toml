[task]
name = "afterquery/blade-tip-timing"
description = "Write a reusable blade-tip-timing analysis program that, from the raw once-per-rev and probe trigger times of a fast resonance sweep, identifies the engine order and each mistuned blade's resonance frequency, damping ratio and steady-state resonant tip amplitude, on any rotor recorded in the facility format."
authors = [{ name = "Deepak Kumar", email = "deepakkumar.dar@gmail.com" }]
keywords = ["analysis tool", "high-cycle fatigue", "blade tip timing", "turbomachinery", "mistuning", "modal damping identification", "engine order", "transient resonance passage", "Southwell coefficient"]

