difficulty_explanation = "Data are synthetic, from the disclosed seeded generator in authoring/provenance/generate.py: uncoupled mistuned single-mode blades with a Southwell stiffening law and engine-order forcing are integrated in time through a fast speed sweep, and probe arrival times are computed from the deflected tips, with timing jitter, unknown probe-angle errors, stagger and untwist, missed and spurious probe triggers, a probe dropout across the resonance region, and a faulty once-per-rev record. The deliverable is a program that is also run on three unseen rotors with different blade count, tip radius, Southwell coefficient, probe count and layout, engine order, speed range and sweep direction, so it must implement the full tip-timing reduction robustly rather than be tuned to one file: OPR repair, blade assignment immune to bad triggers, static zeroing, multi-probe synchronous fitting and identification of the undocumented engine order. Three physics points decide the numbers. Centrifugal stiffening maps speed bandwidth to damping through EO - S/EO (ignoring it biases damping by +5 to +25%). The sweeps are fast relative to the blades' decay time (damping 0.12-0.35%), so the resonance passage is transient and its distortion flips sign between acceleration and deceleration; steady-state fits bias frequency by about 0.3% and damping by +7 to +19% on average, so a transient model driven by the measured speed history is needed. Measured peaks are attenuated (5-16% on average, up to about 34%), so the steady-state resonant amplitude for fatigue assessment must be reconstructed from the identified forcing gain and damping. A specialist needs a working day or more to build and validate such a tool."
solution_explanation = "solution/solve.py (installed as /app/btt_analyze.py by solve.sh) reads rig.json; repairs the OPR record against the local median period (drops spurious mid-revolution triggers, fills missed pulses); fits a cubic spline of shaft angle; assigns each probe trigger to the nearest blade slot (off-slot and duplicate triggers dropped); converts angular lag to tip deflection and removes a constant per blade and probe; fits c + a cos(EO alpha_p) + b sin(EO alpha_p) per revolution and blade and picks the EO in 1-30 with the least residual in the vibrating revolutions; cleans response jumps with a rolling median; seeds f0 and zeta with a steady-state centrifugally stiffened SDOF fit; then for each blade integrates the slow complex envelope of the SDOF response under the measured speed history and fits it to every probe sample, with f0 and zeta nonlinear and the complex gain, per-probe offsets and a quadratic drift linear (variable projection), with 5-sigma trimming. Outputs: f_res = EO f0 / sqrt(EO^2 - S), zeta, and the steady resonant amplitude |G| / (2 zeta)."
verification_explanation = "The verifier copies each run under tests/heldout (the shipped example plus three unseen rotors) to a scratch directory and executes python3 /app/btt_analyze.py <run_dir> <out.json> on it as the unprivileged user nobody with a 10-minute limit; ground truth in tests/truth is root-only, so the program cannot read it. Ground truth is the generator's own parameters, independent of the reference solution: EO, f_res = EO f0 / sqrt(EO^2 - S), zeta and forcing deflection / (2 zeta). Every run must have the exact EO, every blade's frequency within 0.25%, damping within 25% with the run's mean signed damping error within +/-7%, and steady resonant amplitude within 15%; non-numeric, non-finite, non-positive or missing values fail. Tolerances come from the spread of correct methods: over the 4 shipped runs and 12 re-seeded copies the reference gets EO right every time, frequency within 0.05%, damping within 17.7% worst blade (run means within +/-1.9%) and amplitude within 9.6%; a steady-state fit with measured peaks fails every run (frequency about 0.3%, amplitude 22-34%), ignoring Southwell fails three of four rotors, constant answers fail, and a program that tries to read the truth finds nothing."

