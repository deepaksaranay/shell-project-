difficulty_explanation = "The data are synthetic, from a disclosed seeded generator (authoring/provenance/generate.py): 24 uncoupled single-degree-of-freedom blade modes with mistuned natural frequency and damping, a centrifugal (Southwell) stiffening law, and engine-order forcing are integrated in time through a measured-style speed history, and probe arrival times are computed from the blade tip positions, with timing jitter, unknown probe-angle installation errors, blade stagger, speed-dependent untwist, missed and spurious triggers, and one probe that drops out over part of the resonance region. Only raw OPR and trigger times are given. The solver has to build the whole tip-timing chain: shaft angle from the once-per-rev signal, blade assignment robust to bad triggers, deflection extraction with static zeroing, a multi-probe synchronous fit, and identification of the undocumented engine order. Two physics points decide the damping. (1) The mode stiffens with speed, so a speed bandwidth maps to damping through EO - S/EO, not EO; ignoring this biases damping by about +13%. (2) The run-up (about 167 rpm/s) is fast compared with the blades' decay time (damping 0.12-0.35%), so the resonance passage is transient: the peak shifts, broadens and rings. Steady-state curve fits and half-power estimates bias frequency by about 0.3% and damping by about +15% and fail; damping has to come from a transient model driven by the measured speed history. A domain expert needs most of a working day to build and check such a pipeline."
solution_explanation = "Cubic spline of rotor angle through the OPR times; each trigger is converted to shaft angle and assigned to the nearest blade slot (triggers far from any slot, and duplicate triggers, are discarded). Tip deflection is the tip radius times the angular lag behind the slot. A constant per blade and probe is removed (speed-dependent untwist is common to all probes and drops out in the per-revolution constant). For each revolution and blade, d_p = c + a cos(EO alpha_p) + b sin(EO alpha_p) is fitted across the probes, and EO is chosen as the integer whose fit leaves the least residual in the vibrating revolutions. A steady-state centrifugally stiffened SDOF fit seeds the final step: for each blade, the slow complex envelope of the SDOF response to unit engine-order forcing is integrated under the measured speed history and fitted directly to every probe sample, with (f0, zeta) nonlinear and the complex gain, per-probe offsets and a quadratic drift solved linearly (variable projection) and 5-sigma outlier trimming. The resonance frequency is EO f0 / sqrt(EO^2 - S)."
verification_explanation = "Ground truth is the generator's own blade parameters, independent of the reference solution: the engine order, each blade's damping ratio, and each blade's natural frequency at its resonance crossing, EO f0 / sqrt(EO^2 - S), stored in tests/expected.json and baked into the verifier image. The tests read /app/output/blade_modal_results.json and require the exact engine order, every blade's frequency within 0.25% relative, every blade's damping within 25% relative, and the signed relative damping error averaged over the 24 blades within +/-7%; non-numeric, non-finite or non-positive values fail. Tolerances were set from the spread of correct methods on the shipped data and on three freshly generated seeds: the transient reference stays within 0.04% on frequency and 9.4% on damping per blade (mean within +/-1.6%), while a steady-state SDOF fit (frequency about 0.3%, damping mean +8.5 to +15%) and a fit that ignores centrifugal stiffening (damping mean +12 to +15%) fail on every dataset tried; constant answers fail the per-blade checks."

